<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Promotional Image</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      /* Use your image as the full-screen background */
      background-image: url('promotional_image.png');
      background-size: cover;        /* make it fill the screen */
      background-position: center;   /* center the image */
      background-repeat: no-repeat;  /* no tiling */
      background-attachment: fixed;  /* optional: keep it fixed when scrolling */
    }
  </style>
</head>
<body>
</body>
</html>
